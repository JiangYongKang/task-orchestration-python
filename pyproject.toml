[project]
name = "task-orchestration-python"
version = "0.1.0"
requires-python = ">=3.14.4"
dependencies = [
    "fastapi[standard]>=0.141.1",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[dependency-groups]
dev = [
    "pytest>=9.0",
    "httpx>=0.28",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
log_cli = false
log_level = "INFO"
log_format = "%(asctime)s %(levelname)s %(name)s %(message)s"
